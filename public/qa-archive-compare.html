<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>企业碳档案表单 · 设计 QA</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#eef3f0;color:#1f2c26;font-family:"PingFang SC","Microsoft YaHei",sans-serif}.board{min-height:100vh;padding:24px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.head h1{margin:0;font-size:22px}.head p{margin:0;color:#718078;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{overflow:hidden;border:1px solid #dce5e1;border-radius:14px;background:#fff;box-shadow:0 12px 36px rgba(42,62,53,.08)}.label{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #e5ebe8;font-size:12px;font-weight:700}.label span{font-weight:400;color:#839088}.visual{height:calc(100vh - 102px);overflow:hidden;background:#f9fbfa}.visual img{display:block;width:175%;max-width:none;height:auto}.panel:last-child .visual img{width:125%}
    </style>
  </head>
  <body>
    <main class="board">
      <header class="head"><div><h1>企业碳档案字段呈现</h1><p>源图为信息密度参考；实现按最新需求改为双列表单并移除证据列。</p></div><p>桌面端 · 1280 × 720</p></header>
      <section class="grid">
        <article class="panel"><div class="label">参考图 <span>字段信息密度与侧栏顺序</span></div><div class="visual"><img src="/assets/archive-form-reference.png" alt="用户上传的企业碳档案参考图" /></div></article>
        <article class="panel"><div class="label">当前实现 <span>双列表单，仅字段值与报告期</span></div><div class="visual"><img src="/assets/archive-form-implementation.jpg" alt="当前企业碳档案表单实现" /></div></article>
      </section>
    </main>
  </body>
</html>
